<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd feature design diagram</title>
  <desc id="dsc">KV, Watch, Lease, Auth, Cluster and Maintenance, with their methods and behavioural contracts.</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · Feature Design</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">Six API domains — methods and behavioural contracts</text><rect x="40" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#4fb3ff" stroke-width="1.5"/><text x="88.0" y="185" font-size="20" fill="#4fb3ff" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text><text x="126.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">KV store</text><text x="126.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">core reads and writes, prefix</text><text x="126.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">scans, atomic transactions</text><line x1="66" y1="222" x2="371" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="244" r="2.5" fill="#4fb3ff"/><text x="80.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">put(k, v[, lease, prevKv])</text><circle cx="69" cy="269" r="2.5" fill="#4fb3ff"/><text x="80.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">get(k[, rangeEnd, limit, revision])</text><circle cx="69" cy="294" r="2.5" fill="#4fb3ff"/><text x="80.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">getByPrefix(p) / getOrFail(k)</text><circle cx="69" cy="319" r="2.5" fill="#4fb3ff"/><text x="80.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">delete(k) / deleteByPrefix(p)</text><circle cx="69" cy="344" r="2.5" fill="#4fb3ff"/><text x="80.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">txn(compare, success, failure)</text><circle cx="69" cy="369" r="2.5" fill="#4fb3ff"/><text x="80.0" y="373" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">compact(revision) reclaims history</text><line x1="66" y1="388" x2="371" y2="388" stroke="#20406b" stroke-width="1"/><text x="66.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Results come back as associative arrays;</text><text x="66.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">getOrFail() raises KeyNotFoundException; txn</text><text x="66.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">uses the compare → success / failure form.</text><rect x="421" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="469.0" y="185" font-size="20" fill="#2dd4bf" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">W</text><text x="507.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Watch</text><text x="507.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">long-lived event stream over HTTP</text><text x="507.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">chunked</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="461.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="461.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="461.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="461.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">chunked streaming, non-blocking I/O</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="461.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">auto-reconnect, resumes from lastRevision</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="447.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">After EOF it backs off 100ms×n and reconnects</text><text x="447.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">to another endpoint, so failover loses no</text><text x="447.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">events.</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="888.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Lease</text><text x="888.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">keys with a TTL, cleaned up by etcd</text><text x="888.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">on expiry</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="842.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="842.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">keepAlive(id) renews once</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="842.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">timeToLive(id[, keys]) inspects</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="842.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">list() lists active leases</text><circle cx="831" cy="344" r="2.5" fill="#fbbf24"/><text x="842.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">revoke(id) deletes bound keys</text><line x1="828" y1="388" x2="1133" y2="388" stroke="#20406b" stroke-width="1"/><text x="828.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Service registration: grant + put(lease) + a</text><text x="828.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">periodic keepAlive heartbeat; a crashed</text><text x="828.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">process needs no cleanup.</text><rect x="40" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="88.0" y="539" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A</text><text x="126.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Auth</text><text x="126.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC: users → roles → permissions</text><line x1="66" y1="576" x2="371" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="598" r="2.5" fill="#a78bfa"/><text x="80.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="80.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="80.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="80.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="80.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="80.0" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="66.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Permission types 0=READ 1=WRITE 2=READWRITE;</text><text x="66.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">once auth is on, the client needs auth.user /</text><text x="66.0" y="797.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">auth.password.</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="507.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Cluster</text><text x="507.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">member add/remove and the learner</text><text x="507.0" y="567" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lifecycle</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="461.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberList() members</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="461.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="461.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="461.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="461.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="447.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">A learner joins without a vote, then gets</text><text x="447.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">promoted to voter, so scaling out never</text><text x="447.0" y="797.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">breaks quorum.</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="888.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Maintenance</text><text x="888.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">cluster status, alarms and backups</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="842.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="842.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="842.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">defragment() reclaims space</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="842.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">hash([revision]) KV checksum</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="842.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">snapshot() returns raw binary</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="828.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">snapshot() returns raw binary through</text><text x="828.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">sendRaw(), ready to be written to disk as a</text><text x="828.0" y="797.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">backup.</text><text x="40.0" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400">Every failure raises a typed exception from Erikwang2013\Etcd\Exception; the HTTP and gRPC transports share one subsystem API.</text>
</svg>
