<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Diagramme de cycle de vie erikwang2013/etcd</title>
  <desc id="dsc">Les cycles de vie : requête, watch et lease.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2dd4bf"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#fbbf24"/></marker></defs><rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · Cycle de vie</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">Une requête, un watch, un lease — trois pistes</text><rect x="40" y="118" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="136" r="6" fill="#4fb3ff"/><text x="80.0" y="141" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Cycle de vie d&#x27;une requête</text><text x="274.4" y="141" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">appels synchrones : de la construction à la sémantique d&#x27;erreur</text><rect x="40" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="58.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Construction</text><circle cx="61" cy="220" r="2.5" fill="#4fb3ff"/><text x="72.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">new EtcdClient($config)</text><circle cx="61" cy="236" r="2.5" fill="#4fb3ff"/><text x="72.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fusionne les défauts, lit les variables</text><text x="72.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ETCD_*</text><circle cx="61" cy="268" r="2.5" fill="#4fb3ff"/><text x="72.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TransportSelector choisit auto / http / grpc</text><line x1="308" y1="244.0" x2="318" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="342.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Encodage</text><circle cx="345" cy="220" r="2.5" fill="#4fb3ff"/><text x="356.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">KvClient / WatchClient montent le corps</text><circle cx="345" cy="236" r="2.5" fill="#4fb3ff"/><text x="356.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key et value passent par base64_encode</text><circle cx="345" cy="252" r="2.5" fill="#4fb3ff"/><text x="356.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">préfixe → range_end via</text><text x="356.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">prefixToRangeEnd()</text><line x1="592" y1="244.0" x2="602" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="626.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Transport &amp; retry</text><circle cx="629" cy="220" r="2.5" fill="#4fb3ff"/><text x="640.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint aléatoire, le client PSR-18</text><text x="640.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">appelle /v3/*</text><circle cx="629" cy="252" r="2.5" fill="#4fb3ff"/><text x="640.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">échec transport : jusqu&#x27;à retry tentatives</text><circle cx="629" cy="268" r="2.5" fill="#4fb3ff"/><text x="640.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">backoff linéaire 100ms×n, puis un autre</text><text x="640.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint</text><line x1="876" y1="244.0" x2="886" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="910.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Réponse &amp; erreurs</text><circle cx="913" cy="220" r="2.5" fill="#4fb3ff"/><text x="924.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">réponse décodée base64 en tableaux</text><circle cx="913" cy="236" r="2.5" fill="#4fb3ff"/><text x="924.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">401 → AuthException (non réessayé)</text><circle cx="913" cy="252" r="2.5" fill="#4fb3ff"/><text x="924.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">4xx / 5xx → EtcdException</text><text x="40.0" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Branche d&#x27;échec : seul ConnectionException déclenche un réessai ; les erreurs auth et serveur sont levées directement à l&#x27;appelant.</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="80.0" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Cycle de vie Watch</text><text x="225.5" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">flux longue durée : événements et failover</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="58.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Abonnement</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="72.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="72.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end délimite la plage surveillée</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="72.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">startRevision / prevKv / progressNotify en</text><text x="72.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">option</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="342.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Ouvrir le flux</text><circle cx="345" cy="514" r="2.5" fill="#2dd4bf"/><text x="356.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fopen + stream_context direct sur</text><text x="356.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">/v3/watch</text><circle cx="345" cy="546" r="2.5" fill="#2dd4bf"/><text x="356.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">stream_set_blocking(false) lecture non</text><text x="356.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">bloquante</text><circle cx="345" cy="578" r="2.5" fill="#2dd4bf"/><text x="356.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">découpe le tampon en trames JSON par</text><text x="356.0" y="598" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ligne</text><line x1="592" y1="538.0" x2="602" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="626.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Distribution</text><circle cx="629" cy="514" r="2.5" fill="#2dd4bf"/><text x="640.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">décode les événements PUT / DELETE et</text><text x="640.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">header.revision</text><circle cx="629" cy="546" r="2.5" fill="#2dd4bf"/><text x="640.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">mémorise lastRevision comme ancre de</text><text x="640.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">reprise</text><circle cx="629" cy="578" r="2.5" fill="#2dd4bf"/><text x="640.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">transmet les événements au callback</text><line x1="876" y1="538.0" x2="886" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="910.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Reprise après coupure</text><circle cx="913" cy="514" r="2.5" fill="#2dd4bf"/><text x="924.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF ou socket coupé → backoff, nouvel</text><text x="924.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint</text><circle cx="913" cy="546" r="2.5" fill="#2dd4bf"/><text x="924.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">start_revision = lastRevision</text><circle cx="913" cy="562" r="2.5" fill="#2dd4bf"/><text x="924.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">failover sans perdre d&#x27;événements</text><path d="M 1025.0 614 V 644 H 457.0 V 618" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah2)"/><text x="741.0" y="660" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">reconnexion</text><text x="40.0" y="676" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Boucle : ④ revient à ② pour reconstruire la connexion ; lastRevision reprend là où le flux s&#x27;est arrêté.</text><rect x="40" y="706" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="724" r="6" fill="#fbbf24"/><text x="80.0" y="729" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Cycle de vie Lease</text><text x="223.9" y="729" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">enregistrement de service : heartbeat TTL et purge</text><rect x="40" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="58.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Créer le lease</text><circle cx="61" cy="808" r="2.5" fill="#fbbf24"/><text x="72.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lease()-&gt;grant(ttl)</text><circle cx="61" cy="824" r="2.5" fill="#fbbf24"/><text x="72.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">retourne {ID, TTL} ; ID réutilisable</text><circle cx="61" cy="840" r="2.5" fill="#fbbf24"/><text x="72.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">le TTL est décompté par le serveur etcd</text><line x1="308" y1="832.0" x2="318" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="342.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Lier les clés</text><circle cx="345" cy="808" r="2.5" fill="#fbbf24"/><text x="356.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">put(key, value, [&#x27;lease&#x27; =&gt; $ID])</text><circle cx="345" cy="824" r="2.5" fill="#fbbf24"/><text x="356.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">un lease peut lier plusieurs clés</text><circle cx="345" cy="840" r="2.5" fill="#fbbf24"/><text x="356.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">les clés vivent et meurent avec le lease</text><line x1="592" y1="832.0" x2="602" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="626.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Heartbeat</text><circle cx="629" cy="808" r="2.5" fill="#fbbf24"/><text x="640.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">un timer appelle keepAlive($ID) pour</text><text x="640.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">rafraîchir le TTL</text><circle cx="629" cy="840" r="2.5" fill="#fbbf24"/><text x="640.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timeToLive($ID, true) liste les clés liées</text><circle cx="629" cy="856" r="2.5" fill="#fbbf24"/><text x="640.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">un renouvellement réussi = service en vie</text><line x1="876" y1="832.0" x2="886" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="910.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Expiration</text><circle cx="913" cy="808" r="2.5" fill="#fbbf24"/><text x="924.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">le TTL atteint zéro, ou revoke() est appelé</text><circle cx="913" cy="824" r="2.5" fill="#fbbf24"/><text x="924.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd supprime toutes les clés liées</text><circle cx="913" cy="840" r="2.5" fill="#fbbf24"/><text x="924.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">un process planté n&#x27;a rien à nettoyer</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">renouvellement</text><text x="40.0" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Boucle : ③ se répète toutes les TTL/3 jusqu&#x27;à l&#x27;arrêt du service — un health check distribué.</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="58.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">requête synchrone</text><circle cx="200.43200000000002" cy="996" r="5" fill="#2dd4bf"/><text x="213.4" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">flux longue durée</text><circle cx="348.53200000000004" cy="996" r="5" fill="#fbbf24"/><text x="361.5" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">lease / TTL</text>
</svg>
