<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1331" width="1200" height="1331" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd आर्किटेक्चर आरेख</title>
  <desc id="dsc">पाँच परतें: फ़्रेमवर्क अडैप्टर, फ़ैकेड, सबसिस्टम क्लाइंट, ट्रांसपोर्ट और etcd सर्वर; साथ में क्रॉस-कटिंग चिंताएँ, मैसेज लेयर और exception ट्री।</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · आर्किटेक्चर</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">PHP etcd v3 क्लाइंट — परतें, निर्भरता दिशा और त्रुटि सेमांटिक्स</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker></defs><rect x="890" y="130" width="270" height="383.0" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><circle cx="912" cy="198" r="3.5" fill="#2dd4bf"/><text x="924.0" y="202" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">कॉन्फ़िग व एनवायरनमेंट</text><text x="924.0" y="221" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoints / transport / scheme / timeout /</text><text x="924.0" y="236.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">retry / auth; वरना ETCD_* env वेरिएबल।</text><circle cx="912" cy="259.0" r="3.5" fill="#2dd4bf"/><text x="924.0" y="263.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">सिंगलटन लाइफ़साइकल</text><text x="924.0" y="282.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EtcdClient::instance() — Webman जैसे बिना</text><text x="924.0" y="297.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">DI; resetInstance() — टेस्ट रीसेट।</text><circle cx="912" cy="320.0" r="3.5" fill="#2dd4bf"/><text x="924.0" y="324.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">रीट्राई व बैकऑफ़</text><text x="924.0" y="343.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">ट्रांसपोर्ट फ़ेल पर ही रीट्राई; अधिकतम</text><text x="924.0" y="358.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">retry, 100ms×n बैकऑफ़, नया एंडपॉइंट।</text><circle cx="912" cy="381.0" r="3.5" fill="#2dd4bf"/><text x="924.0" y="385.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">base64 एनकोडिंग</text><text x="924.0" y="404.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">gRPC-gateway key / value को base64</text><text x="924.0" y="419.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">स्ट्रिंग; दोनों तरफ़ ऑटो कन्वर्ट।</text><circle cx="912" cy="442.0" r="3.5" fill="#2dd4bf"/><text x="924.0" y="446.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">प्रीफ़िक्स → range_end</text><text x="924.0" y="465.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">prefixToRangeEnd() आख़िरी बाइट बढ़ाकर</text><text x="924.0" y="480.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">ऊपरी सीमा; सब 0xFF हो तो \x00।</text><rect x="40" y="1041" width="1120" height="246" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="60.0" y="1073" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">exception ट्री — सभी RuntimeException से, retryable सेमांटिक्स से बँटे</text><rect x="60" y="1155" width="250" height="64" rx="12" fill="#0b1220" stroke="#f87171" stroke-width="1.5"/><text x="185.0" y="1183" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">EtcdException</text><text x="185.0" y="1205" font-size="10.5" fill="#8aa0bd" text-anchor="middle" font-weight="400">retryable फ़्लैग</text><rect x="360" y="1107" width="800" height="44" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="378.0" y="1134" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">ConnectionException</text><text x="533.3" y="1134" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— टाइमआउट / DNS फ़ेल / रिफ़्यूज़्ड → रीट्राई</text><rect x="360" y="1165" width="800" height="44" rx="12" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="378.0" y="1192" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">AuthException</text><text x="489.9" y="1192" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— HTTP 401 ऑथ फ़ेल → रीट्राई नहीं</text><rect x="360" y="1223" width="800" height="44" rx="12" fill="#0b1220" stroke="#5b7699" stroke-width="1.5"/><text x="378.0" y="1250" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">KeyNotFoundException</text><text x="540.5" y="1250" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— getOrFail() नहीं मिला → कॉलर संभाले</text><line x1="310" y1="1187" x2="336" y2="1187" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="336" y2="1245" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="358" y2="1129" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1187" x2="358" y2="1187" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1245" x2="358" y2="1245" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="890" y="533.0" width="270" height="466.0" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="910.0" y="565.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Protobuf मैसेज स्टब्स</text><line x1="910" y1="579.0" x2="1140" y2="579.0" stroke="#20406b" stroke-width="1"/><text x="910.0" y="603.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">सादे PHP डेटा क्लास,</text><text x="910.0" y="618.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Google\Protobuf\Internal\Message से विरासत</text><text x="910.0" y="634.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">नहीं; ट्रांसपोर्ट इनसे एनकोड/डिकोड करता</text><text x="910.0" y="649.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">है, नेटवर्क हॉप नहीं।</text><circle cx="914" cy="671.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="675.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Mvccpb — KeyValue / Event</text><circle cx="914" cy="690.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="694.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Etcdserverpb — 60+ संदेश</text><circle cx="914" cy="709.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="713.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Authpb — User / Role / Permission</text><line x1="910" y1="734.0" x2="1140" y2="734.0" stroke="#20406b" stroke-width="1"/><text x="910.0" y="756.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">रनटाइम निर्भरताएँ</text><text x="910.0" y="780.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-client ^1.0  ज़रूरी</text><text x="910.0" y="798.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-factory ^1.0  ज़रूरी</text><text x="910.0" y="816.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grpc/grpc  सुझाया (gRPC)</text><text x="910.0" y="834.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">google/protobuf  सुझाया</text><text x="910.0" y="852.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">php &gt;= 8.0</text><text x="40.0" y="130" font-size="15" fill="#7dd3fc" text-anchor="start" font-weight="700">① फ़्रेमवर्क अडैप्टर</text><rect x="40" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="135.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Laravel</text><text x="135.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ServiceProvider + Facade</text><rect x="250" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="345.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Hyperf</text><text x="345.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ConfigProvider (ऑटो-डिस्कवरी)</text><rect x="460" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="555.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">ThinkPHP</text><text x="555.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Service + Facade</text><rect x="670" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="765.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Webman</text><text x="765.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Plugin::install()</text><line x1="450" y1="224" x2="450" y2="248" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="245" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">ऑटो-डिस्कवरी / मैनुअल रजिस्ट्रेशन</text><text x="40.0" y="258" font-size="15" fill="#4fb3ff" text-anchor="start" font-weight="700">② फ़ैकेड परत</text><rect x="40" y="272" width="820" height="120" rx="16" fill="#16253c" stroke="#4fb3ff" stroke-width="1.5"/><text x="450.0" y="304" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">EtcdClient — एकल प्रवेश, छह सबसिस्टम लेज़ी बनाता है</text><rect x="60" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="120.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">kv</text><rect x="192" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="252.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch</text><rect x="324" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="384.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">lease</text><rect x="456" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="516.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">auth</text><rect x="588" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="648.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">cluster</text><rect x="720" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="780.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">maintenance</text><line x1="450" y1="392" x2="450" y2="416" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="413" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">डोमेन मेथड कॉल</text><text x="40.0" y="426" font-size="15" fill="#2dd4bf" text-anchor="start" font-weight="700">③ सबसिस्टम — छह API डोमेन</text><rect x="40" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">KvClient</text><text x="58.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">put / get / getByPrefix / txn / compact</text><rect x="320" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="338.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">WatchClient</text><text x="338.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">watch / watchPrefix · ड्रॉप के बाद</text><text x="338.0" y="513" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">रिज़्यूम</text><rect x="600" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="618.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">LeaseClient</text><text x="618.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">grant / keepAlive / revoke / TTL</text><rect x="40" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">AuthClient · UserClient · RoleClient</text><text x="58.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC: यूज़र / रोल / अनुमति</text><rect x="320" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="338.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">ClusterClient</text><text x="338.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">सदस्य जोड़ें/हटाएँ / Learner प्रोमोट</text><rect x="600" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="618.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">MaintenanceClient</text><text x="618.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">status / alarm / defrag / snapshot</text><line x1="450" y1="620" x2="450" y2="644" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="641" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">send() / sendRaw() / watch()</text><text x="40.0" y="654" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700">④ ट्रांसपोर्ट</text><rect x="40" y="668" width="820" height="57" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="60.0" y="694" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">TransportSelector</text><text x="60.0" y="714" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">transport = grpc → GrpcTransport ｜ http → HttpTransport ｜ auto → ext-grpc और Grpc\BaseStub दोनों जाँचता है; दोनों हों तभी gRPC, वरना HTTP</text><rect x="40" y="751" width="400" height="96" rx="12" fill="#111c2e" stroke="#2dd4bf" stroke-width="1.5"/><text x="58.0" y="781" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">HttpTransport</text><text x="58.0" y="805" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd का अंतर्निहित gRPC-gateway, HTTP पर JSON</text><text x="58.0" y="825" font-size="10.5" fill="#5b7699" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">cURL / stream / PSR-18</text><rect x="383.2" y="765" width="40.800000000000004" height="22" rx="11" fill="#0b1220" stroke="#2dd4bf" stroke-width="1"/><text x="403.6" y="780" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">तैयार</text><rect x="460" y="751" width="400" height="96" rx="12" fill="#111c2e" stroke="#fbbf24" stroke-width="1.5"/><text x="478.0" y="781" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">GrpcTransport</text><text x="478.0" y="805" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Grpc\Channel रीयूज़, नेटिव स्ट्रीमिंग</text><text x="478.0" y="825" font-size="10.5" fill="#5b7699" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">ext-grpc + grpc/grpc + google/protobuf</text><rect x="803.2" y="765" width="40.800000000000004" height="22" rx="11" fill="#0b1220" stroke="#fbbf24" stroke-width="1"/><text x="823.6" y="780" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">ढांचा</text><path d="M 450 725 V 737 H 240 V 749" fill="none" stroke="#20406b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 450 725 V 737 H 660 V 749" fill="none" stroke="#20406b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="450" y1="847" x2="450" y2="871" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="868" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">TCP :2379</text><text x="40.0" y="881" font-size="15" fill="#fb923c" text-anchor="start" font-weight="700">⑤ etcd सर्वर क्लस्टर (v3.x)</text><rect x="40" y="895" width="820" height="104" rx="16" fill="#16253c" stroke="#fb923c" stroke-width="1.5"/><rect x="60" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="181.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">gRPC-gateway  /v3/*</text><text x="181.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">HTTP JSON प्रवेश</text><rect x="322" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="443.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">नेटिव gRPC  :2379</text><text x="443.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">उच्च थ्रूपुट / द्विदिश</text><rect x="584" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="705.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Raft + MVCC</text><text x="705.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">सहमति · वर्शन · Lease</text>
