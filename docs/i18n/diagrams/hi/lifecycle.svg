<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd लाइफ़साइकल आरेख</title>
  <desc id="dsc">रिक्वेस्ट, watch और lease — तीन लाइफ़साइकल।</desc>
