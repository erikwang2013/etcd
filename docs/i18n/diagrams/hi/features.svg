<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd फ़ीचर डिज़ाइन आरेख</title>
  <desc id="dsc">KV, Watch, Lease, Auth, Cluster और Maintenance — छह डोमेन, उनके मेथड और व्यवहार अनुबंध।</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · फ़ीचर डिज़ाइन</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">छह API डोमेन — मेथड और व्यवहार अनुबंध</text><rect x="40" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#4fb3ff" stroke-width="1.5"/><text x="88.0" y="185" font-size="20" fill="#4fb3ff" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text><text x="126.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">KV स्टोर</text><text x="126.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd की रीड/राइट, प्रीफ़िक्स स्कैन,</text><text x="126.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">परमाणु txn</text><line x1="66" y1="222" x2="371" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="244" r="2.5" fill="#4fb3ff"/><text x="80.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">put(k, v[, lease, prevKv])</text><circle cx="69" cy="269" r="2.5" fill="#4fb3ff"/><text x="80.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">get(k[, rangeEnd, limit, revision])</text><circle cx="69" cy="294" r="2.5" fill="#4fb3ff"/><text x="80.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">getByPrefix(p) / getOrFail(k)</text><circle cx="69" cy="319" r="2.5" fill="#4fb3ff"/><text x="80.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">delete(k) / deleteByPrefix(p)</text><circle cx="69" cy="344" r="2.5" fill="#4fb3ff"/><text x="80.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">txn(compare, success, failure)</text><circle cx="69" cy="369" r="2.5" fill="#4fb3ff"/><text x="80.0" y="373" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">compact(revision) इतिहास मिटाएँ</text><line x1="66" y1="388" x2="371" y2="388" stroke="#20406b" stroke-width="1"/><text x="66.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">नतीजे असोसिएटिव ऐरे; getOrFail() मिस हो तो</text><text x="66.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">KeyNotFoundException; txn compare → success /</text><text x="66.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">failure रूप में।</text><rect x="421" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="469.0" y="185" font-size="20" fill="#2dd4bf" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">W</text><text x="507.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Watch मॉनिटरिंग</text><text x="507.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">HTTP chunked पर लंबी event स्ट्रीम</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="461.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="461.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="461.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="461.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">चंक्ड स्ट्रीम, नॉन-ब्लॉक I/O</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="461.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">रीकनेक्ट, lastRevision से आगे</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="447.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF के बाद 100ms×n बैकऑफ़, रैंडम नया</text><text x="447.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">एंडपॉइंट; फ़ेलओवर में इवेंट नहीं खोते।</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="888.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Lease लीज़</text><text x="888.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL वाली key, एक्सपायरी पर etcd</text><text x="888.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">मिटा देता है</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="842.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="842.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">keepAlive(id) एक बार रिन्यू</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="842.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">timeToLive(id[, keys]) स्थिति</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="842.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">list() सक्रिय लीज़</text><circle cx="831" cy="344" r="2.5" fill="#fbbf24"/><text x="842.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">revoke(id) बाउंड key हटाएँ</text><line x1="828" y1="388" x2="1133" y2="388" stroke="#20406b" stroke-width="1"/><text x="828.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">सेवा पंजीकरण: grant + put(lease) + keepAlive</text><text x="828.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">हार्टबीट; क्रैश पर सफ़ाई की ज़रूरत नहीं।</text><rect x="40" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="88.0" y="539" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A</text><text x="126.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Auth प्रमाणीकरण</text><text x="126.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC: यूज़र → रोल → अनुमति</text><line x1="66" y1="576" x2="371" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="598" r="2.5" fill="#a78bfa"/><text x="80.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="80.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="80.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="80.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="80.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="80.0" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="66.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">अनुमति प्रकार 0=READ 1=WRITE 2=READWRITE;</text><text x="66.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">auth चालू होने पर क्लाइंट को auth.user /</text><text x="66.0" y="797.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">auth.password चाहिए।</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="507.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Cluster प्रबंधन</text><text x="507.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">सदस्य जोड़ें/हटाएँ, Learner</text><text x="507.0" y="567" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">लाइफ़साइकल</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="461.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberList() सदस्य सूची</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="461.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="461.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="461.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="461.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="447.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Learner पहले बिना वोट के जुड़ता है, फिर Voter</text><text x="447.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">बनता है, तो स्केल-आउट quorum नहीं तोड़ता।</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="888.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Maintenance ऑप्स</text><text x="888.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">क्लस्टर स्टेटस, अलार्म और बैकअप</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="842.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="842.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="842.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">defragment() डीफ़्रैग</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="842.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">hash([revision]) KV चेकसम</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="842.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">snapshot() रॉ बाइनरी</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="828.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">snapshot() sendRaw() से रॉ बाइनरी, सीधे बैकअप</text><text x="828.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">फ़ाइल बनाकर सेव करें।</text><text x="40.0" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400">हर विफलता Erikwang2013\Etcd\Exception से टाइप्ड exception; HTTP व gRPC एक ही subsystem API साझा करते हैं।</text>
</svg>
