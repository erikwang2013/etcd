<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1331" width="1200" height="1331" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 아키텍처 설계도</title>
  <desc id="dsc">5계층 구조: 프레임워크 어댑터, 파사드, 하위 시스템, 전송 계층과 etcd 서버. 여기에 횡단 관심사, 메시지 계층과 예외 체계를 더한다.</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 아키텍처 설계</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">PHP etcd v3 클라이언트 —— 계층 구조, 의존 방향과 오류 의미</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker></defs><rect x="890" y="130" width="270" height="445.0" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><circle cx="912" cy="198" r="3.5" fill="#2dd4bf"/><text x="924.0" y="202" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">설정과 환경 변수</text><text x="924.0" y="221" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoints / transport / scheme / timeout /</text><text x="924.0" y="236.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">retry / auth, 미지정 시 ETCD_* 환경 변수를</text><text x="924.0" y="252.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">읽는다.</text><circle cx="912" cy="274.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="278.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">싱글턴 생명주기</text><text x="924.0" y="297.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EtcdClient::instance()는 DI 없는 Webman 등</text><text x="924.0" y="313.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">에, resetInstance()는 테스트 초기화용.</text><circle cx="912" cy="335.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="339.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">재시도와 백오프</text><text x="924.0" y="358.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">전송 계층 실패만 재시도하며 최대 retry회,</text><text x="924.0" y="374.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">100ms×n 선형 백오프로 엔드포인트를 교체</text><text x="924.0" y="389.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">한다.</text><circle cx="912" cy="412.0" r="3.5" fill="#2dd4bf"/><text x="924.0" y="416.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">base64 인코딩</text><text x="924.0" y="435.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">gRPC-gateway는 key / value를 base64 문자</text><text x="924.0" y="450.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">열로 요구하며 송수신 양쪽에서 자동 변환한</text><text x="924.0" y="466.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">다.</text><circle cx="912" cy="488.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="492.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">접두사 → range_end</text><text x="924.0" y="511.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">prefixToRangeEnd()가 마지막 바이트를 증</text><text x="924.0" y="527.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">가시켜 상한을 구하고, 전부 0xFF면 \x00으</text><text x="924.0" y="542.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">로 폴백한다.</text><rect x="40" y="1041" width="1120" height="246" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="60.0" y="1073" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">예외 체계 —— 모두 RuntimeException을 상속하고 retryable 기준으로 분기</text><rect x="60" y="1155" width="250" height="64" rx="12" fill="#0b1220" stroke="#f87171" stroke-width="1.5"/><text x="185.0" y="1183" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">EtcdException</text><text x="185.0" y="1205" font-size="10.5" fill="#8aa0bd" text-anchor="middle" font-weight="400">retryable 플래그</text><rect x="360" y="1107" width="800" height="44" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="378.0" y="1134" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">ConnectionException</text><text x="533.3" y="1134" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— 연결 타임아웃 / DNS 실패 / 연결 거부 → 재시도함</text><rect x="360" y="1165" width="800" height="44" rx="12" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="378.0" y="1192" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">AuthException</text><text x="489.9" y="1192" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— HTTP 401 인증 실패 → 재시도 안 함</text><rect x="360" y="1223" width="800" height="44" rx="12" fill="#0b1220" stroke="#5b7699" stroke-width="1.5"/><text x="378.0" y="1250" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">KeyNotFoundException</text><text x="540.5" y="1250" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— getOrFail() 미스 → 호출자가 처리</text><line x1="310" y1="1187" x2="336" y2="1187" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="336" y2="1245" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="358" y2="1129" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1187" x2="358" y2="1187" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1245" x2="358" y2="1245" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="890" y="595.0" width="270" height="404.0" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="910.0" y="627.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">메시지 계층 · Protobuf 스텁</text><line x1="910" y1="641.0" x2="1140" y2="641.0" stroke="#20406b" stroke-width="1"/><text x="910.0" y="665.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">순수 PHP 데이터 클래스로</text><text x="910.0" y="680.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Google\Protobuf\Internal\Message를 상속하지</text><text x="910.0" y="696.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">않는다. 전송 계층이 인코딩에 쓸 뿐 네트워크</text><text x="910.0" y="711.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">홉이 아니다.</text><circle cx="914" cy="733.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="737.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Mvccpb —— KeyValue / Event</text><circle cx="914" cy="752.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="756.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Etcdserverpb —— 60+ 요청 / 응답</text><circle cx="914" cy="771.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="775.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Authpb — User / Role / Permission</text><line x1="910" y1="796.0" x2="1140" y2="796.0" stroke="#20406b" stroke-width="1"/><text x="910.0" y="818.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">런타임 의존성</text><text x="910.0" y="842.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-client ^1.0  필수</text><text x="910.0" y="860.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-factory ^1.0  필수</text><text x="910.0" y="878.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grpc/grpc  제안 (gRPC 전송)</text><text x="910.0" y="896.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">google/protobuf  제안</text><text x="910.0" y="914.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">php &gt;= 8.0</text><text x="40.0" y="130" font-size="15" fill="#7dd3fc" text-anchor="start" font-weight="700">① 프레임워크 어댑터 계층</text><rect x="40" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="135.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Laravel</text><text x="135.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ServiceProvider + Facade</text><rect x="250" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="345.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Hyperf</text><text x="345.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ConfigProvider (자동 검색)</text><rect x="460" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="555.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">ThinkPHP</text><text x="555.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Service + Facade</text><rect x="670" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="765.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Webman</text><text x="765.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Plugin::install()</text><line x1="450" y1="224" x2="450" y2="248" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="245" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">자동 검색 / 수동 등록</text><text x="40.0" y="258" font-size="15" fill="#4fb3ff" text-anchor="start" font-weight="700">② 파사드 계층</text><rect x="40" y="272" width="820" height="120" rx="16" fill="#16253c" stroke="#4fb3ff" stroke-width="1.5"/><text x="450.0" y="304" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">EtcdClient —— 단일 진입점, 6대 하위 시스템을 지연 생성</text><rect x="60" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="120.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">kv</text><rect x="192" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="252.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch</text><rect x="324" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="384.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">lease</text><rect x="456" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="516.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">auth</text><rect x="588" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="648.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">cluster</text><rect x="720" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="780.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">maintenance</text><line x1="450" y1="392" x2="450" y2="416" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="413" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">도메인 메서드 호출</text><text x="40.0" y="426" font-size="15" fill="#2dd4bf" text-anchor="start" font-weight="700">③ 하위 시스템 계층 —— 6대 API 도메인</text><rect x="40" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">KvClient</text><text x="58.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">put / get / getByPrefix / txn / compact</text><rect x="320" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="338.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">WatchClient</text><text x="338.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">watch / watchPrefix · 끊김 후 재개</text><rect x="600" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="618.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">LeaseClient</text><text x="618.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">grant / keepAlive / revoke / TTL</text><rect x="40" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">AuthClient · UserClient · RoleClient</text><text x="58.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC: 사용자 / 역할 / 권한</text><rect x="320" y=