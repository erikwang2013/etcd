<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 생명주기 그림</title>
  <desc id="dsc">요청 생명주기, Watch 생명주기와 Lease 생명주기 세 갈래.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2dd4bf"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#fbbf24"/></marker></defs><rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 생명주기</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">요청 하나, Watch 하나, 리스 하나 —— 세 갈래 흐름</text><rect x="40" y="118" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="136" r="6" fill="#4fb3ff"/><text x="80.0" y="141" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">요청 생명주기</text><text x="197.0" y="141" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">동기 호출: 생성부터 예외 처리까지</text><rect x="40" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="58.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 생성과 설정</text><circle cx="61" cy="220" r="2.5" fill="#4fb3ff"/><text x="72.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">new EtcdClient($config)</text><circle cx="61" cy="236" r="2.5" fill="#4fb3ff"/><text x="72.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">기본값 병합, ETCD_* 환경 변수 읽기</text><circle cx="61" cy="252" r="2.5" fill="#4fb3ff"/><text x="72.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TransportSelector가 auto / http</text><text x="72.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">/ grpc 선택</text><line x1="308" y1="244.0" x2="318" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="342.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② 요청 인코딩</text><circle cx="345" cy="220" r="2.5" fill="#4fb3ff"/><text x="356.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">KvClient / WatchClient가 요청 본</text><text x="356.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">문 구성</text><circle cx="345" cy="252" r="2.5" fill="#4fb3ff"/><text x="356.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key와 value를 base64_encode</text><circle cx="345" cy="268" r="2.5" fill="#4fb3ff"/><text x="356.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">접두사를 prefixToRangeEnd()로</text><text x="356.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end 변환</text><line x1="592" y1="244.0" x2="602" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="626.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 전송과 재시도</text><circle cx="629" cy="220" r="2.5" fill="#4fb3ff"/><text x="640.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">랜덤 엔드포인트로 PSR-18 클라이언트</text><text x="640.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">가 /v3/* 전송</text><circle cx="629" cy="252" r="2.5" fill="#4fb3ff"/><text x="640.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">전송 계층 실패: 최대 retry회 재시도</text><circle cx="629" cy="268" r="2.5" fill="#4fb3ff"/><text x="640.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">100ms×n 선형 백오프 후 엔드포인트</text><text x="640.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">교체</text><line x1="876" y1="244.0" x2="886" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="910.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 응답과 예외</text><circle cx="913" cy="220" r="2.5" fill="#4fb3ff"/><text x="924.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">응답을 base64 디코딩해 연관 배열로</text><circle cx="913" cy="236" r="2.5" fill="#4fb3ff"/><text x="924.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">401 → AuthException (재시도 안</text><text x="924.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">함)</text><circle cx="913" cy="268" r="2.5" fill="#4fb3ff"/><text x="924.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">4xx / 5xx → EtcdException</text><text x="40.0" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">실패 분기: ConnectionException만 재시도하고 인증·서버 오류는 호출자에게 즉시 던진다.</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="80.0" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Watch 생명주기</text><text x="212.0" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">장기 연결: 이벤트 스트림과 장애 조치</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="58.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 감시 등록</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="72.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="72.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end로 감시 범위 지정</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="72.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">startRevision / prevKv /</text><text x="72.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">progressNotify 지정</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="342.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② 청크 스트림 개설</text><circle cx="345" cy="514" r="2.5" fill="#2dd4bf"/><text x="356.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fopen + stream_context로</text><text x="356.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">/v3/watch 직결</text><circle cx="345" cy="546" r="2.5" fill="#2dd4bf"/><text x="356.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">stream_set_blocking(false) 논블</text><text x="356.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">로킹 읽기</text><circle cx="345" cy="578" r="2.5" fill="#2dd4bf"/><text x="356.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">버퍼를 줄 단위로 나눠 JSON 프레임</text><text x="356.0" y="598" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">처리</text><line x1="592" y1="538.0" x2="602" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="626.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 이벤트 분배</text><circle cx="629" cy="514" r="2.5" fill="#2dd4bf"/><text x="640.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">PUT / DELETE 이벤트와</text><text x="640.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">header.revision 파싱</text><circle cx="629" cy="546" r="2.5" fill="#2dd4bf"/><text x="640.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lastRevision을 재개 기준점으로 기</text><text x="640.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">록</text><circle cx="629" cy="578" r="2.5" fill="#2dd4bf"/><text x="640.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">이벤트를 콜백으로 전달</text><line x1="876" y1="538.0" x2="886" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="910.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 끊김 후 재개</text><circle cx="913" cy="514" r="2.5" fill="#2dd4bf"/><text x="924.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF 또는 연결 끊김 → 백오프 후 엔드</text><text x="924.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">포인트 교체</text><circle cx="913" cy="546" r="2.5" fill="#2dd4bf"/><text x="924.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">start_revision = lastRevision로</text><text x="924.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">재개</text><circle cx="913" cy="578" r="2.5" fill="#2dd4bf"/><text x="924.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">장애 조치에도 이벤트 미손실</text><path d="M 1025.0 614 V 644 H 457.0 V 618" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah2)"/><text x="741.0" y="660" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">재연결</text><text x="40.0" y="676" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">순환: ④ 실패 후 ②로 돌아가 연결을 다시 세우고, lastRevision이 끊긴 지점부터 이어 준다.</text><rect x="40" y="706" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="724" r="6" fill="#fbbf24"/><text x="80.0" y="729" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Lease 생명주기</text><text x="212.0" y="729" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">서비스 등록: TTL 하트비트와 자동 정리</text><rect x="40" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="58.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 리스 생성</text><circle cx="61" cy="808" r="2.5" fill="#fbbf24"/><text x="72.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lease()-&gt;grant(ttl)</text><circle cx="61" cy="824" r="2.5" fill="#fbbf24"/><text x="72.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">{ID, TTL} 반환, ID 재사용 가능</text><circle cx="61" cy="840" r="2.5" fill="#fbbf24"/><text x="72.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL 타이머는 etcd 서버가 담당</text><line x1="308" y1="832.0" x2="318" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="342.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② key 바인딩</text><circle cx="345" cy="808" r="2.5" fill="#fbbf24"/><text x="356.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">put(key, value, [&#x27;lease&#x27; =&gt;</text><text x="356.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">$ID])</text><circle cx="345" cy="840" r="2.5" fill="#fbbf24"/><text x="356.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">리스 하나에 여러 key 바인딩</text><circle cx="345" cy="856" r="2.5" fill="#fbbf24"/><text x="356.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key는 리스와 함께 소멸</text><line x1="592" y1="832.0" x2="602" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="626.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 하트비트 갱신</text><circle cx="629" cy="808" r="2.5" fill="#fbbf24"/><text x="640.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">타이머가 keepAlive($ID)로 TTL 갱</text><text x="640.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">신</text><circle cx="629" cy="840" r="2.5" fill="#fbbf24"/><text x="640.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timeToLive($ID, true)로 바인딩</text><text x="640.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key 조회</text><circle cx="629" cy="872" r="2.5" fill="#fbbf24"/><text x="640.0" y="876" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">갱신 성공은 서비스 생존을 뜻함</text><line x1="876" y1="832.0" x2="886" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="910.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 만료 정리</text><circle cx="913" cy="808" r="2.5" fill="#fbbf24"/><text x="924.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL이 0이 되거나 revoke() 호출</text><circle cx="913" cy="824" r="2.5" fill="#fbbf24"/><text x="924.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd가 바인딩된 key를 모두 삭제</text><circle cx="913" cy="840" r="2.5" fill="#fbbf24"/><text x="924.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">프로세스가 죽어도 직접 정리 불필요</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">주기 갱신</text><text x="40.0" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">순환: ③을 TTL/3 주기로 서비스 종료까지 반복하면 분산 헬스 체크가 된다.</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="58.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">동기 요청</text><circle cx="156.2" cy="996" r="5" fill="#2dd4bf"/><text x="169.2" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">장기 연결 스트림</text><circle cx="310.6" cy="996" r="5" fill="#fbbf24"/><text x="323.6" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">리스 / TTL</text>
</svg>
