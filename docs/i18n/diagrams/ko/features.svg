<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 기능 설계도</title>
  <desc id="dsc">KV, Watch, Lease, Auth, Cluster, Maintenance 6대 기능 도메인의 메서드와 동작 규약.</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 기능 설계</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">6대 API 도메인 —— 메서드와 동작 규약</text><rect x="40" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#4fb3ff" stroke-width="1.5"/><text x="88.0" y="185" font-size="20" fill="#4fb3ff" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text><text x="126.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">KV 키-값 저장소</text><text x="126.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd의 핵심 읽기·쓰기, 접두사 스캔과 원자적</text><text x="126.0" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">트랜잭션</text><line x1="66" y1="222" x2="371" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="244" r="2.5" fill="#4fb3ff"/><text x="80.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">put(k, v[, lease, prevKv])</text><circle cx="69" cy="269" r="2.5" fill="#4fb3ff"/><text x="80.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">get(k[, rangeEnd, limit, revision])</text><circle cx="69" cy="294" r="2.5" fill="#4fb3ff"/><text x="80.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">getByPrefix(p) / getOrFail(k)</text><circle cx="69" cy="319" r="2.5" fill="#4fb3ff"/><text x="80.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">delete(k) / deleteByPrefix(p)</text><circle cx="69" cy="344" r="2.5" fill="#4fb3ff"/><text x="80.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">txn(compare, success, failure)</text><circle cx="69" cy="369" r="2.5" fill="#4fb3ff"/><text x="80.0" y="373" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">compact(revision) 이력 회수</text><line x1="66" y1="388" x2="371" y2="388" stroke="#20406b" stroke-width="1"/><text x="66.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">결과는 연관 배열; getOrFail()은 키 미스 시</text><text x="66.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">KeyNotFoundException, txn은 compare → success / failure 3</text><text x="66.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">단계.</text><rect x="421" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="469.0" y="185" font-size="20" fill="#2dd4bf" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">W</text><text x="507.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Watch 변경 감시</text><text x="507.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">HTTP chunked 기반 장기 연결 이벤트 스트림</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="461.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="461.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="461.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="461.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">chunked 스트리밍, 논블로킹 I/O</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="461.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">자동 재연결, lastRevision부터 재개</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="447.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF 후 100ms×n 백오프로 다른 엔드포인트에 재연결하므로</text><text x="447.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">장애 조치에도 이벤트를 잃지 않는다.</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="888.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Lease 리스</text><text x="888.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL이 있는 key, 만료 시 etcd가 자동 정리</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="842.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="842.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">keepAlive(id) 1회 갱신</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="842.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">timeToLive(id[, keys]) 상태 조회</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="842.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">list() 활성 리스 목록</text><circle cx="831" cy="344" r="2.5" fill="#fbbf24"/><text x="842.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">revoke(id) 바인딩 key 삭제</text><line x1="828" y1="388" x2="1133" y2="388" stroke="#20406b" stroke-width="1"/><text x="828.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">서비스 등록 정석: grant + put(lease) + 주기적 keepAlive 하트</text><text x="828.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">비트. 프로세스가 죽어도 직접 정리할 필요가 없다.</text><rect x="40" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="88.0" y="539" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A</text><text x="126.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Auth 인증/인가</text><text x="126.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC: 사용자 → 역할 → 권한</text><line x1="66" y1="576" x2="371" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="598" r="2.5" fill="#a78bfa"/><text x="80.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="80.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="80.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="80.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="80.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="80.0" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="66.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">권한 타입 0=READ 1=WRITE 2=READWRITE; 인증을 켜면</text><text x="66.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">클라이언트에 auth.user / auth.password가 필요하다.</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="507.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Cluster 클러스터 관리</text><text x="507.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">멤버 추가·삭제와 Learner 생명주기</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="461.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberList() 멤버 목록</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="461.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="461.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="461.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="461.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="447.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Learner는 비투표 상태로 참여한 뒤 Voter로 승격되므로 증설</text><text x="447.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">해도 quorum이 깨지지 않는다.</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="888.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Maintenance 운영</text><text x="888.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">클러스터 상태, 알람과 백업</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="842.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="842.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="842.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">defragment() 공간 회수</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="842.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">hash([revision]) KV 해시 검증</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="842.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">snapshot() 원시 바이너리 반환</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="828.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">snapshot()은 sendRaw()로 원시 바이너리를 반환하므로 그대</text><text x="828.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">로 백업 파일로 저장할 수 있다.</text><text x="40.0" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400">모든 메서드 실패 시 Erikwang2013\Etcd\Exception 계열의 타입 예외를 던진다. HTTP와 gRPC 전송은 같은 하위 시스템 API를 공유한다.</text>
</svg>
