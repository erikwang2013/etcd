<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd ライフサイクル図</title>
  <desc id="dsc">リクエスト、Watch、Lease のライフサイクル。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2dd4bf"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#fbbf24"/></marker></defs><rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · ライフサイクル</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">1 リクエスト、1 ウォッチ、1 リース —— 3 本のトラック</text><rect x="40" y="118" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="136" r="6" fill="#4fb3ff"/><text x="80.0" y="141" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">リクエストライフサイクル</text><text x="278.0" y="141" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">同期呼び出し：構築からエラー処理まで</text><rect x="40" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="58.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 構築と設定</text><circle cx="61" cy="220" r="2.5" fill="#4fb3ff"/><text x="72.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">new EtcdClient($config)</text><circle cx="61" cy="236" r="2.5" fill="#4fb3ff"/><text x="72.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">既定値をマージし ETCD_* 環境変数を読</text><text x="72.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">む</text><circle cx="61" cy="268" r="2.5" fill="#4fb3ff"/><text x="72.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TransportSelector が auto / http / grpc を</text><text x="72.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">選定</text><line x1="308" y1="244.0" x2="318" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="342.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② リクエストの符号化</text><circle cx="345" cy="220" r="2.5" fill="#4fb3ff"/><text x="356.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">KvClient / WatchClient がリクエスト本体</text><text x="356.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">を組立</text><circle cx="345" cy="252" r="2.5" fill="#4fb3ff"/><text x="356.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key と value を base64_encode</text><circle cx="345" cy="268" r="2.5" fill="#4fb3ff"/><text x="356.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">プレフィックスを prefixToRangeEnd() で</text><text x="356.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end へ変換</text><line x1="592" y1="244.0" x2="602" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="626.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 転送と再試行</text><circle cx="629" cy="220" r="2.5" fill="#4fb3ff"/><text x="640.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ランダムなエンドポイントへ PSR-18 ク</text><text x="640.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ライアントが /v3/* を送信</text><circle cx="629" cy="252" r="2.5" fill="#4fb3ff"/><text x="640.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">トランスポート層の失敗：最大 retry 回再</text><text x="640.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">試行</text><circle cx="629" cy="284" r="2.5" fill="#4fb3ff"/><text x="640.0" y="288" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">100ms×n の線形バックオフ後、別のエン</text><text x="640.0" y="304" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ドポイントで再試行</text><line x1="876" y1="244.0" x2="886" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="910.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 応答と例外</text><circle cx="913" cy="220" r="2.5" fill="#4fb3ff"/><text x="924.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">応答を base64 デコードし連想配列へ</text><circle cx="913" cy="236" r="2.5" fill="#4fb3ff"/><text x="924.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">401 → AuthException（再試行しない）</text><circle cx="913" cy="252" r="2.5" fill="#4fb3ff"/><text x="924.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">4xx / 5xx → EtcdException</text><text x="40.0" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">失敗分岐：ConnectionException のみ再試行。認証・サーバエラーはそのまま呼び出し側へ送出。</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="80.0" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Watch ライフサイクル</text><text x="249.7" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">長寿命ストリーム：イベントとフェイルオーバー</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="58.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① ウォッチ登録</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="72.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="72.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end で監視範囲を指定</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="72.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">startRevision / prevKv / progressNotify は</text><text x="72.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">任意</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="342.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② ストリームの確立</text><circle cx="345" cy="514" r="2.5" fill="#2dd4bf"/><text x="356.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fopen + stream_context で /v3/watch に直</text><text x="356.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">結</text><circle cx="345" cy="546" r="2.5" fill="#2dd4bf"/><text x="356.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">stream_set_blocking(false) で非ブロッキ</text><text x="356.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ング読み取り</text><circle cx="345" cy="578" r="2.5" fill="#2dd4bf"/><text x="356.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">バッファを JSON フレーム単位で行単位</text><text x="356.0" y="598" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">に分割</text><line x1="592" y1="538.0" x2="602" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="626.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ イベント配信</text><circle cx="629" cy="514" r="2.5" fill="#2dd4bf"/><text x="640.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">PUT / DELETE イベントと</text><text x="640.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">header.revision を解析</text><circle cx="629" cy="546" r="2.5" fill="#2dd4bf"/><text x="640.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lastRevision を再開アンカーとして記録</text><circle cx="629" cy="562" r="2.5" fill="#2dd4bf"/><text x="640.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">イベントをコールバックへ引き渡す</text><line x1="876" y1="538.0" x2="886" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="910.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 切断後の再開</text><circle cx="913" cy="514" r="2.5" fill="#2dd4bf"/><text x="924.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF やソケット切断 → バックオフし別の</text><text x="924.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">エンドポイント</text><circle cx="913" cy="546" r="2.5" fill="#2dd4bf"/><text x="924.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">start_revision = lastRevision</text><circle cx="913" cy="562" r="2.5" fill="#2dd4bf"/><text x="924.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">イベントを失わないフェイルオーバー</text><path d="M 1025.0 614 V 644 H 457.0 V 618" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah2)"/><text x="741.0" y="660" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">再接続</text><text x="40.0" y="676" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">ループ：④ が失敗すると ② に戻り接続を再構築。lastRevision が中断点からの再開を保証。</text><rect x="40" y="706" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="724" r="6" fill="#fbbf24"/><text x="80.0" y="729" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Lease ライフサイクル</text><text x="248.0" y="729" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">サービス登録：TTL ハートビートと自動削除</text><rect x="40" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="58.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① リースの作成</text><circle cx="61" cy="808" r="2.5" fill="#fbbf24"/><text x="72.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lease()-&gt;grant(ttl)</text><circle cx="61" cy="824" r="2.5" fill="#fbbf24"/><text x="72.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">戻り値は {ID, TTL}、ID の再利用も可能</text><circle cx="61" cy="840" r="2.5" fill="#fbbf24"/><text x="72.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL は etcd サーバが計時</text><line x1="308" y1="832.0" x2="318" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="342.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② key のバインド</text><circle cx="345" cy="808" r="2.5" fill="#fbbf24"/><text x="356.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">put(key, value, [&#x27;lease&#x27; =&gt; $ID])</text><circle cx="345" cy="824" r="2.5" fill="#fbbf24"/><text x="356.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">1 つのリースに複数の key をバインド可</text><text x="356.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">能</text><circle cx="345" cy="856" r="2.5" fill="#fbbf24"/><text x="356.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key はリースと運命を共にする</text><line x1="592" y1="832.0" x2="602" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="626.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ ハートビート更新</text><circle cx="629" cy="808" r="2.5" fill="#fbbf24"/><text x="640.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">タイマで keepAlive($ID) を呼び TTL を更</text><text x="640.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">新</text><circle cx="629" cy="840" r="2.5" fill="#fbbf24"/><text x="640.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timeToLive($ID, true) でバインド key を一</text><text x="640.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">覧</text><circle cx="629" cy="872" r="2.5" fill="#fbbf24"/><text x="640.0" y="876" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">更新成功はサービス稼働の証</text><line x1="876" y1="832.0" x2="886" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="910.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 期限切れ</text><circle cx="913" cy="808" r="2.5" fill="#fbbf24"/><text x="924.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL が 0 になるか revoke() を呼ぶ</text><circle cx="913" cy="824" r="2.5" fill="#fbbf24"/><text x="924.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd がバインド済み key を削除</text><circle cx="913" cy="840" r="2.5" fill="#fbbf24"/><text x="924.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">プロセスが落ちても手動削除は不要</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">定期更新</text><text x="40.0" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">ループ：③ はサービスが消えるまで TTL/3 ごとに繰り返し。分散ヘルスチェックに相当。</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="58.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">同期リクエスト</text><circle cx="185.0" cy="996" r="5" fill="#2dd4bf"/><text x="198.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">長寿命ストリーム</text><circle cx="337.0" cy="996" r="5" fill="#fbbf24"/><text x="350.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">リース / TTL</text>
</svg>
