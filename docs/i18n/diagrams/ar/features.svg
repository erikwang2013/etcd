o',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="288.3" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="268.8" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="294.8" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="288.3" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="346.9" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="349.8" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">أنواع الصلاحيات 0=READ 1=WRITE 2=READWRITE؛</text><text x="323.4" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">وبعد تفعيل المصادقة يجب ضبط auth.user /</text><text x="158.4" y="797.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">auth.password.</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="680.4" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Cluster · العنقود</text><text x="714.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">إضافة/إزالة الأعضاء ودورة حياة</text><text x="555.3" y="567" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">Learner</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="630.3" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberList() قائمة الأعضاء</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="649.8" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="610.7" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="675.8" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="565.2" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="730.8" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">ينضم Learner دون تصويت ثم يُرقّى إلى Voter،</text><text x="598.8" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">فالتوسع لا يكسر quorum.</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="1102.2" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Maintenance · الصيانة</text><text x="1095.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">حالة العنقود والإنذارات والنسخ</text><text x="950.1" y="567" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">الاحتياطي</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="1076.4" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="1050.3" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="1024.3" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">defragment() استعادة المساحة</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="998.2" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">hash([revision]) تحقق KV</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="1011.3" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">snapshot() إرجاع ثنائي خام</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="1125.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">يُرجع snapshot() ثنائيًا خامًا عبر sendRaw()،</text><text x="1092.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">جاهزًا للكتابة على القرص كنسخة احتياطية.</text><text x="824.8" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400" direction="rtl">كل فشل يرفع استثناءً من Erikwang2013\Etcd\Exception؛ وناقلا HTTP و gRPC يتقاسمان واجهة الأنظمة الفرعية ذاتها.</text>
