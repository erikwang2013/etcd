ch · المراقبة</text><text x="714.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">تدفق أحداث طويل الأمد عبر HTTP</text><text x="555.3" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">chunked</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="604.2" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="610.7" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="714.9" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="688.9" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">قراءة مقسّمة، إدخال/إخراج غير محجوب</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="688.9" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">إعادة اتصال تلقائية من lastRevision</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="724.2" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">بعد EOF يتراجع 100ms×n ويعيد الاتصال بنقطة</text><text x="645.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">أخرى، فلا يفقد التبديل أي حدث.</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="1041.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Lease · الإيجار</text><text x="1101.9" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">مفاتيح بعمر TTL ينظفها etcd عند</text><text x="943.2" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">الانتهاء</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="1024.3" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="998.2" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">keepAlive(id) تجديد واحد</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="1056.8" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">timeToLive(id[, keys]) فحص الحالة</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="1017.8" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight