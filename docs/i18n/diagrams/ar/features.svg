<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">مخطط تصميم الوظائف لـ erikwang2013/etcd</title>
  <desc id="dsc">نطاقات KV وWatch وLease وAuth وCluster وMaintenance مع طرقها والتزاماتها السلوكية.</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="485.7" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">erikwang2013/etcd · تصميم الوظائف</text><text x="352.5" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">ستة نطاقات API — الطرق والالتزامات السلوكية</text><rect x="40" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#4fb3ff" stroke-width="1.5"/><text x="88.0" y="185" font-size="20" fill="#4fb3ff" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text><text x="286.6" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">KV · مخزن المفاتيح</text><text x="325.5" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">قراءة وكتابة أساسية، فحص بالبادئة</text><text x="206.5" y="213" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">ومعاملات ذرية</text><line x1="66" y1="222" x2="371" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="244" r="2.5" fill="#4fb3ff"/><text x="244.3" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">put(k, v[, lease, prevKv])</text><circle cx="69" cy="269" r="2.5" fill="#4fb3ff"/><text x="301.2" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">get(k[, rangeEnd, limit, revision])</text><circle cx="69" cy="294" r="2.5" fill="#4fb3ff"/><text x="263.3" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">getByPrefix(p) / getOrFail(k)</text><circle cx="69" cy="319" r="2.5" fill="#4fb3ff"/><text x="263.3" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">delete(k) / deleteByPrefix(p)</text><circle cx="69" cy="344" r="2.5" fill="#4fb3ff"/><text x="269.6" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">txn(compare, success, failure)</text><circle cx="69" cy="369" r="2.5" fill="#4fb3ff"/><text x="326.5" y="373" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">compact(revision) ضغط الإصدارات القديمة</text><line x1="66" y1="388" x2="371" y2="388" stroke="#20406b" stroke-width="1"/><text x="291.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">النتائج مصفوفات ترابطية؛ getOrFail() يرفع</text><text x="355.6" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">KeyNotFoundException؛ وtxn بالشكل compare → success /</text><text x="99.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">failure.</text><rect x="421" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="469.0" y="185" font-size="20" fill="#2dd4bf" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">W</text><text x="650.3" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Watch · المراقبة</text><text x="734.9" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">تدفق أحداث طويل الأمد عبر HTTP chunked</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="600.1" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="606.4" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="707.5" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="682.2" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">قراءة مقسّمة، إدخال/إخراج غير محجوب</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="682.2" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">إعادة اتصال تلقائية من lastRevision</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="727.3" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">بعد EOF يتراجع 100ms×n ويعيد الاتصال بنقطة أخرى،</text><text x="579.3" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">فلا يفقد التبديل أي حدث.</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="1019.9" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Lease · الإيجار</text><text x="1123.2" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">مفاتيح بعمر TTL ينظفها etcd عند الانتهاء</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="1019.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="993.7" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">keepAlive(id) تجديد واحد</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="1050.6" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">timeToLive(id[, keys]) فحص الحالة</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="1012.7" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">list() سرد الإيجارات النشطة</text><circle cx="831" cy="344" r="2.5" fill="#fbbf24"/><text x="1088.5" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">revoke(id) إلغاء وحذف المفاتيح المرتبطة</text><line x1="828" y1="388" x2="1133" y2="388" stroke="#20406b" stroke-width="1"/><text x="1093.3" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">التسجيل المعتاد للخدمات: grant + put(lease) + نبضة</text><text x="1109.6" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">keepAlive دورية؛ فلا يحتاج انهيار العملية أي تنظيف.</text><rect x="40" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="88.0" y="539" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A</text><text x="256.1" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Auth · المصادقة</text><text x="356.8" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">RBAC: المستخدمون → الأدوار → الصلاحيات</text><line x1="66" y1="576" x2="371" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="598" r="2.5" fill="#a78bfa"/><text x="276.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="282.3" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="263.3" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="288.6" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="282.3" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="339.2" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="340.3" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">أنواع الصلاحيات 0=READ 1=WRITE 2=READWRITE؛</text><text x="352.6" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">وبعد تفعيل المصادقة يجب ضبط auth.user / auth.password.</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="645.5" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Cluster · العنقود</text><text x="730.1" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">إضافة/إزالة الأعضاء ودورة حياة Learner</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="625.3" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberList() قائمة الأعضاء</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="644.3" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="606.4" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="669.6" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="562.1" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="742.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">ينضم Learner دون تصويت ثم يُرقّى إلى Voter، فالتوسع لا</text><text x="515.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">يكسر quorum.</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="1070.9" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">Maintenance · الصيانة</text><text x="1132.6" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">حالة العنقود والإنذارات والنسخ الاحتياطي</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="1069.6" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="1044.3" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="1019.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">defragment() استعادة المساحة</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="993.7" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">hash([revision]) تحقق KV</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="1006.3" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace" direction="rtl">snapshot() إرجاع ثنائي خام</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="1117.8" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">يُرجع snapshot() ثنائيًا خامًا عبر sendRaw()، جاهزًا</text><text x="1015.8" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">للكتابة على القرص كنسخة احتياطية.</text><text x="708.6" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400" direction="rtl">كل فشل يرفع استثناءً من Erikwang2013\Etcd\Exception؛ وناقلا HTTP و gRPC يتقاسمان واجهة الأنظمة الفرعية ذاتها.</text>
