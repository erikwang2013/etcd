ادة محاولة)</text><circle cx="913" cy="268" r="2.5" fill="#4fb3ff"/><text x="1055.7" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">4xx / 5xx → EtcdException</text><text x="624.3" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400" direction="rtl">فرع الفشل: ConnectionException وحده يعيد المحاولة؛ أما أخطاء المصادقة والخادم فتُرفع للمستدعي فورًا.</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="198.1" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">دورة حياة Watch</text><text x="470.3" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">تدفق طويل الأمد: الأحداث والتبديل عند الفشل</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="175.5" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700" direction="rtl">① تسجيل المراقبة</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="222.8" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="239.6" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">range_end يحدد نطاق المراقبة</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="267.6" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">startRevision / prevKv / progressNotify</text><text x="123.5" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">اختيارية</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-widt