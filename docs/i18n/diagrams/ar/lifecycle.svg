00" direction="rtl">etcd يحذف كل المفاتيح المرتبطة</text><circle cx="913" cy="856" r="2.5" fill="#fbbf24"/><text x="1137.9" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">انهيار العملية لا يحتاج تنظيفًا</text><text x="965.4" y="876" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">يدويًا</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">تجديد دوري</text><text x="426.4" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400" direction="rtl">حلقة: تتكرر ③ كل TTL/3 حتى تختفي الخدمة — فحص صحة موزّع.</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="130.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">طلب متزامن</text><circle cx="173.0" cy="996" r="5" fill="#2dd4bf"/><text x="294.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">تدفق طويل الأمد</text><circle cx="337.0" cy="996" r="5" fill="#fbbf24"/><text x="414.8" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400" direction="rtl">عقد / TTL</text>
</svg>
