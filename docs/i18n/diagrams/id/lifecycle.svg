<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Diagram siklus hidup erikwang2013/etcd</title>
  <desc id="dsc">Siklus hidup request, watch, dan lease.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2dd4bf"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#fbbf24"/></marker></defs><rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · Siklus Hidup</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">Satu request, satu watch, satu lease — tiga jalur</text><rect x="40" y="118" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="136" r="6" fill="#4fb3ff"/><text x="80.0" y="141" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Siklus hidup request</text><text x="233.1" y="141" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">panggilan sinkron: dari konstruksi ke semantik error</text><rect x="40" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="58.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Konstruksi</text><circle cx="61" cy="220" r="2.5" fill="#4fb3ff"/><text x="72.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">new EtcdClient($config)</text><circle cx="61" cy="236" r="2.5" fill="#4fb3ff"/><text x="72.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">gabung default, baca env ETCD_*</text><circle cx="61" cy="252" r="2.5" fill="#4fb3ff"/><text x="72.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TransportSelector pilih auto / http / grpc</text><line x1="308" y1="244.0" x2="318" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="342.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Encode</text><circle cx="345" cy="220" r="2.5" fill="#4fb3ff"/><text x="356.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">KvClient / WatchClient susun body</text><circle cx="345" cy="236" r="2.5" fill="#4fb3ff"/><text x="356.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key dan value lewat base64_encode</text><circle cx="345" cy="252" r="2.5" fill="#4fb3ff"/><text x="356.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">prefix → range_end via</text><text x="356.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">prefixToRangeEnd()</text><line x1="592" y1="244.0" x2="602" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="626.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Transport &amp; retry</text><circle cx="629" cy="220" r="2.5" fill="#4fb3ff"/><text x="640.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint acak, klien PSR-18 kirim ke /v3/*</text><circle cx="629" cy="236" r="2.5" fill="#4fb3ff"/><text x="640.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">gagal transport: retry maksimal retry kali</text><circle cx="629" cy="252" r="2.5" fill="#4fb3ff"/><text x="640.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">backoff linear 100ms×n, lalu ganti</text><text x="640.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint</text><line x1="876" y1="244.0" x2="886" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="910.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Response &amp; error</text><circle cx="913" cy="220" r="2.5" fill="#4fb3ff"/><text x="924.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">response didekode balik dari base64</text><circle cx="913" cy="236" r="2.5" fill="#4fb3ff"/><text x="924.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">401 → AuthException (tidak diulang)</text><circle cx="913" cy="252" r="2.5" fill="#4fb3ff"/><text x="924.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">4xx / 5xx → EtcdException</text><text x="40.0" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Cabang gagal: hanya ConnectionException yang diulang; error auth dan server langsung dilempar ke pemanggil.</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="80.0" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Siklus hidup Watch</text><text x="225.5" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">aliran jangka panjang: event dan failover</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="58.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Berlangganan</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="72.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="72.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">range_end membatasi rentang pantau</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="72.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">startRevision / prevKv / progressNotify</text><text x="72.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">opsional</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="342.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Buka aliran</text><circle cx="345" cy="514" r="2.5" fill="#2dd4bf"/><text x="356.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fopen + stream_context langsung ke</text><text x="356.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">/v3/watch</text><circle cx="345" cy="546" r="2.5" fill="#2dd4bf"/><text x="356.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">stream_set_blocking(false) baca</text><text x="356.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">non-blocking</text><circle cx="345" cy="578" r="2.5" fill="#2dd4bf"/><text x="356.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">pecah buffer jadi frame JSON per baris</text><line x1="592" y1="538.0" x2="602" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="626.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Kirim event</text><circle cx="629" cy="514" r="2.5" fill="#2dd4bf"/><text x="640.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">dekode event PUT / DELETE dan</text><text x="640.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">header.revision</text><circle cx="629" cy="546" r="2.5" fill="#2dd4bf"/><text x="640.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">simpan lastRevision sebagai anchor</text><text x="640.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">resume</text><circle cx="629" cy="578" r="2.5" fill="#2dd4bf"/><text x="640.0" y="582" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">teruskan event ke callback Anda</text><line x1="876" y1="538.0" x2="886" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="910.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Resume setelah putus</text><circle cx="913" cy="514" r="2.5" fill="#2dd4bf"/><text x="924.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF atau socket putus → backoff,</text><text x="924.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoint baru</text><circle cx="913" cy="546" r="2.5" fill="#2dd4bf"/><text x="924.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">start_revision = lastRevision saat resume</text><circle cx="913" cy="562" r="2.5" fill="#2dd4bf"/><text x="924.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">failover tanpa kehilangan event</text><path d="M 1025.0 614 V 644 H 457.0 V 618" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah2)"/><text x="741.0" y="660" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">reconnect</text><text x="40.0" y="676" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Loop: ④ kembali ke ② untuk membangun ulang koneksi; lastRevision membuatnya lanjut dari titik terakhir.</text><rect x="40" y="706" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="724" r="6" fill="#fbbf24"/><text x="80.0" y="729" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Siklus hidup Lease</text><text x="223.9" y="729" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">registrasi layanan: heartbeat TTL dan pembersihan</text><rect x="40" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="58.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① Buat lease</text><circle cx="61" cy="808" r="2.5" fill="#fbbf24"/><text x="72.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lease()-&gt;grant(ttl)</text><circle cx="61" cy="824" r="2.5" fill="#fbbf24"/><text x="72.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">kembalikan {ID, TTL}; ID boleh dipakai</text><text x="72.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">ulang</text><circle cx="61" cy="856" r="2.5" fill="#fbbf24"/><text x="72.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL dihitung oleh server etcd</text><line x1="308" y1="832.0" x2="318" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="342.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② Ikat key</text><circle cx="345" cy="808" r="2.5" fill="#fbbf24"/><text x="356.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">put(key, value, [&#x27;lease&#x27; =&gt; $ID])</text><circle cx="345" cy="824" r="2.5" fill="#fbbf24"/><text x="356.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">satu lease bisa mengikat banyak key</text><circle cx="345" cy="840" r="2.5" fill="#fbbf24"/><text x="356.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key hidup dan mati bersama lease</text><line x1="592" y1="832.0" x2="602" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="626.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ Heartbeat</text><circle cx="629" cy="808" r="2.5" fill="#fbbf24"/><text x="640.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timer memanggil keepAlive($ID) untuk</text><text x="640.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">refresh TTL</text><circle cx="629" cy="840" r="2.5" fill="#fbbf24"/><text x="640.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timeToLive($ID, true) daftar key terikat</text><circle cx="629" cy="856" r="2.5" fill="#fbbf24"/><text x="640.0" y="860" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">renew berhasil berarti layanan hidup</text><line x1="876" y1="832.0" x2="886" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="910.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ Kedaluwarsa</text><circle cx="913" cy="808" r="2.5" fill="#fbbf24"/><text x="924.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL mencapai nol, atau revoke() dipanggil</text><circle cx="913" cy="824" r="2.5" fill="#fbbf24"/><text x="924.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd menghapus semua key yang terikat</text><circle cx="913" cy="840" r="2.5" fill="#fbbf24"/><text x="924.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">proses crash tidak perlu dibersihkan</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">renew</text><text x="40.0" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">Loop: ③ berulang tiap TTL/3 sampai layanan berhenti — setara health check terdistribusi.</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="58.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">request sinkron</text><circle cx="183.032" cy="996" r="5" fill="#2dd4bf"/><text x="196.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">aliran jangka panjang</text><circle cx="353.092" cy="996" r="5" fill="#fbbf24"/><text x="366.1" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">lease / TTL</text>
</svg>
