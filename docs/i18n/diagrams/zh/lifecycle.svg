<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1036" width="1200" height="1036" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 生命周期图</title>
  <desc id="dsc">请求生命周期、Watch 生命周期与 Lease 生命周期的三条主线。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#2dd4bf"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#fbbf24"/></marker></defs><rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 生命周期</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">一次请求、一条监听、一个租约 —— 三条主线</text><rect x="40" y="118" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="136" r="6" fill="#4fb3ff"/><text x="80.0" y="141" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">请求生命周期</text><text x="188.0" y="141" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">同步调用：从构造到异常语义</text><rect x="40" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="58.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 构造与配置</text><circle cx="61" cy="220" r="2.5" fill="#4fb3ff"/><text x="72.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">new EtcdClient($config)</text><circle cx="61" cy="236" r="2.5" fill="#4fb3ff"/><text x="72.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">合并默认值，读取 ETCD_* 环境变量</text><circle cx="61" cy="252" r="2.5" fill="#4fb3ff"/><text x="72.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TransportSelector 按 auto / http / grpc 选</text><text x="72.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">定实现</text><line x1="308" y1="244.0" x2="318" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="342.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② 编码请求</text><circle cx="345" cy="220" r="2.5" fill="#4fb3ff"/><text x="356.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">KvClient / WatchClient 组装请求体</text><circle cx="345" cy="236" r="2.5" fill="#4fb3ff"/><text x="356.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key 与 value 做 base64_encode</text><circle cx="345" cy="252" r="2.5" fill="#4fb3ff"/><text x="356.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">前缀经 prefixToRangeEnd() 转 range_end</text><line x1="592" y1="244.0" x2="602" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="626.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 传输与重试</text><circle cx="629" cy="220" r="2.5" fill="#4fb3ff"/><text x="640.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">随机挑端点，PSR-18 客户端发出 /v3/* 请</text><text x="640.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">求</text><circle cx="629" cy="252" r="2.5" fill="#4fb3ff"/><text x="640.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">连接层失败：最多重试 retry 次</text><circle cx="629" cy="268" r="2.5" fill="#4fb3ff"/><text x="640.0" y="272" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">100ms×n 线性退避后换端点重试</text><line x1="876" y1="244.0" x2="886" y2="244.0" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="168" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="168" width="266" height="4" rx="2" fill="#4fb3ff" stroke="none" stroke-width="1.5"/><text x="910.0" y="198" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 响应与异常</text><circle cx="913" cy="220" r="2.5" fill="#4fb3ff"/><text x="924.0" y="224" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">响应 base64 解码为关联数组</text><circle cx="913" cy="236" r="2.5" fill="#4fb3ff"/><text x="924.0" y="240" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">401 → AuthException（不重试）</text><circle cx="913" cy="252" r="2.5" fill="#4fb3ff"/><text x="924.0" y="256" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">4xx / 5xx → EtcdException</text><text x="40.0" y="382" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">失败分支：只有 ConnectionException 触发重试；认证与业务错误立即抛出，交由调用方处理。</text><rect x="40" y="412" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="430" r="6" fill="#2dd4bf"/><text x="80.0" y="435" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Watch 生命周期</text><text x="204.7" y="435" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">长连接：事件流与故障转移</text><rect x="40" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="58.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 注册监听</text><circle cx="61" cy="514" r="2.5" fill="#2dd4bf"/><text x="72.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">watch(key, cb) / watchPrefix()</text><circle cx="61" cy="530" r="2.5" fill="#2dd4bf"/><text x="72.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">计算 range_end 界定监听区间</text><circle cx="61" cy="546" r="2.5" fill="#2dd4bf"/><text x="72.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">可指定 startRevision / prevKv /</text><text x="72.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">progressNotify</text><line x1="308" y1="538.0" x2="318" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="342.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② 建立分块流</text><circle cx="345" cy="514" r="2.5" fill="#2dd4bf"/><text x="356.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">fopen + stream_context 直连 /v3/watch</text><circle cx="345" cy="530" r="2.5" fill="#2dd4bf"/><text x="356.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">stream_set_blocking(false) 非阻塞读</text><circle cx="345" cy="546" r="2.5" fill="#2dd4bf"/><text x="356.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">按行切分 JSON 帧并累积缓冲区</text><line x1="592" y1="538.0" x2="602" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="626.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 事件分发</text><circle cx="629" cy="514" r="2.5" fill="#2dd4bf"/><text x="640.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">解析 PUT / DELETE 事件与</text><text x="640.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">header.revision</text><circle cx="629" cy="546" r="2.5" fill="#2dd4bf"/><text x="640.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">记录 lastRevision 作为续订锚点</text><circle cx="629" cy="562" r="2.5" fill="#2dd4bf"/><text x="640.0" y="566" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">回调交给业务处理</text><line x1="876" y1="538.0" x2="886" y2="538.0" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="462" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="462" width="266" height="4" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.5"/><text x="910.0" y="492" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 断线续订</text><circle cx="913" cy="514" r="2.5" fill="#2dd4bf"/><text x="924.0" y="518" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF 或连接中断 → 退避后换端点</text><circle cx="913" cy="530" r="2.5" fill="#2dd4bf"/><text x="924.0" y="534" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">start_revision = lastRevision 续订</text><circle cx="913" cy="546" r="2.5" fill="#2dd4bf"/><text x="924.0" y="550" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">故障转移不丢事件</text><path d="M 1025.0 614 V 644 H 457.0 V 618" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah2)"/><text x="741.0" y="660" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">断线重连</text><text x="40.0" y="676" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">回环：④ 失败后回到 ② 重建连接，lastRevision 保证断点续传，换端点实现天然故障转移。</text><rect x="40" y="706" width="1120" height="36" rx="10" fill="#16253c" stroke="#20406b" stroke-width="1"/><circle cx="64" cy="724" r="6" fill="#fbbf24"/><text x="80.0" y="729" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">Lease 生命周期</text><text x="203.0" y="729" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">服务注册：TTL 心跳与自动清理</text><rect x="40" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="40" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="58.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">① 创建租约</text><circle cx="61" cy="808" r="2.5" fill="#fbbf24"/><text x="72.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">lease()-&gt;grant(ttl)</text><circle cx="61" cy="824" r="2.5" fill="#fbbf24"/><text x="72.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">返回 {ID, TTL}，可指定 ID 复用</text><circle cx="61" cy="840" r="2.5" fill="#fbbf24"/><text x="72.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL 由 etcd 服务端计时</text><line x1="308" y1="832.0" x2="318" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="324" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="324" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="342.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">② 绑定 key</text><circle cx="345" cy="808" r="2.5" fill="#fbbf24"/><text x="356.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">put(key, value, [&#x27;lease&#x27; =&gt; $ID])</text><circle cx="345" cy="824" r="2.5" fill="#fbbf24"/><text x="356.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">同一租约可绑定多个 key</text><circle cx="345" cy="840" r="2.5" fill="#fbbf24"/><text x="356.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">key 与租约同生共死</text><line x1="592" y1="832.0" x2="602" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="608" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="608" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="626.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">③ 心跳续约</text><circle cx="629" cy="808" r="2.5" fill="#fbbf24"/><text x="640.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">定时 keepAlive($ID) 刷新 TTL</text><circle cx="629" cy="824" r="2.5" fill="#fbbf24"/><text x="640.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">timeToLive($ID, true) 可查绑定的 key</text><circle cx="629" cy="840" r="2.5" fill="#fbbf24"/><text x="640.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">续约成功即服务存活</text><line x1="876" y1="832.0" x2="886" y2="832.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)" opacity="0.7"/><rect x="892" y="756" width="266" height="152" rx="14" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="892" y="756" width="266" height="4" rx="2" fill="#fbbf24" stroke="none" stroke-width="1.5"/><text x="910.0" y="786" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">④ 到期清理</text><circle cx="913" cy="808" r="2.5" fill="#fbbf24"/><text x="924.0" y="812" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">TTL 归零或被 revoke()</text><circle cx="913" cy="824" r="2.5" fill="#fbbf24"/><text x="924.0" y="828" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd 自动删除全部绑定 key</text><circle cx="913" cy="840" r="2.5" fill="#fbbf24"/><text x="924.0" y="844" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">进程崩溃无需手工清理</text><path d="M 781.0 908 V 938 H 701.0 V 912" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah3)"/><text x="741.0" y="954" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">周期续约</text><text x="40.0" y="970" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">回环：③ 按 TTL/3 周期重复直至服务下线，等价于分布式健康检查。</text><line x1="40" y1="974" x2="1160" y2="974" stroke="#20406b" stroke-width="1"/><circle cx="45" cy="996" r="5" fill="#4fb3ff"/><text x="58.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">同步请求</text><circle cx="149.0" cy="996" r="5" fill="#2dd4bf"/><text x="162.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">长连接流</text><circle cx="253.0" cy="996" r="5" fill="#fbbf24"/><text x="266.0" y="1000" font-size="12" fill="#8aa0bd" text-anchor="start" font-weight="400">租约 / TTL</text>
</svg>
