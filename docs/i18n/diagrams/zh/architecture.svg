<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1331" width="1200" height="1331" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 架构设计图</title>
  <desc id="dsc">五层架构：框架适配层、门面层、子系统层、传输层与 etcd 服务端，附横切关注点、消息层与异常体系。</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 架构设计</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">PHP etcd v3 客户端 —— 分层架构、依赖方向与错误语义</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#4fb3ff"/></marker></defs><rect x="890" y="130" width="270" height="398.5" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><circle cx="912" cy="198" r="3.5" fill="#2dd4bf"/><text x="924.0" y="202" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">配置与环境变量</text><text x="924.0" y="221" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">endpoints / transport / scheme / timeout /</text><text x="924.0" y="236.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">retry / auth，未传配置时读取 ETCD_* 环境</text><text x="924.0" y="252.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">变量。</text><circle cx="912" cy="274.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="278.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">单例生命周期</text><text x="924.0" y="297.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EtcdClient::instance() 供 Webman 等无 DI</text><text x="924.0" y="313.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">场景；resetInstance() 供测试重置。</text><circle cx="912" cy="335.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="339.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">重试与退避</text><text x="924.0" y="358.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">只有连接层失败才重试，最多 retry 次，间隔</text><text x="924.0" y="374.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">100ms×n 线性退避并换端点。</text><circle cx="912" cy="396.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="400.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">base64 编解码</text><text x="924.0" y="419.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">gRPC-gateway 要求 key / value 为 base64</text><text x="924.0" y="435.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">字符串，收发两侧自动转换。</text><circle cx="912" cy="457.5" r="3.5" fill="#2dd4bf"/><text x="924.0" y="461.5" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">前缀 → range_end</text><text x="924.0" y="480.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">prefixToRangeEnd() 按字节递增求区间上界</text><text x="924.0" y="496.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">，全 0xFF 时回退 \x00。</text><rect x="40" y="1041" width="1120" height="246" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="60.0" y="1073" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700">异常体系 —— 全部继承自 RuntimeException，按 retryable 语义分流</text><rect x="60" y="1155" width="250" height="64" rx="12" fill="#0b1220" stroke="#f87171" stroke-width="1.5"/><text x="185.0" y="1183" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">EtcdException</text><text x="185.0" y="1205" font-size="10.5" fill="#8aa0bd" text-anchor="middle" font-weight="400">retryable 标记</text><rect x="360" y="1107" width="800" height="44" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="378.0" y="1134" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">ConnectionException</text><text x="533.3" y="1134" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— 连接超时 / DNS 失败 / 连接拒绝 → 触发重试</text><rect x="360" y="1165" width="800" height="44" rx="12" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="378.0" y="1192" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">AuthException</text><text x="489.9" y="1192" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— Token 无效 / 凭据被拒 → 不重试</text><rect x="360" y="1223" width="800" height="44" rx="12" fill="#0b1220" stroke="#5b7699" stroke-width="1.5"/><text x="378.0" y="1250" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">KeyNotFoundException</text><text x="540.5" y="1250" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">—— getOrFail() 未命中 → 业务自行处理</text><line x1="310" y1="1187" x2="336" y2="1187" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="336" y2="1245" stroke="#20406b" stroke-width="1.5"/><line x1="336" y1="1129" x2="358" y2="1129" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1187" x2="358" y2="1187" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="336" y1="1245" x2="358" y2="1245" stroke="#20406b" stroke-width="1.5" marker-end="url(#ah)"/><rect x="890" y="548.5" width="270" height="450.5" rx="16" fill="#16253c" stroke="#20406b" stroke-width="1.5"/><text x="910.0" y="580.5" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Support 层 · 共用解码</text><line x1="910" y1="594.5" x2="1140" y2="594.5" stroke="#20406b" stroke-width="1"/><text x="910.0" y="618.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">网关把 int64/uint64 发成 JSON 字符串、零值</text><text x="910.0" y="634.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">直接省略，字节字段是 base64。解码只此一处</text><text x="910.0" y="649.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">，KV 读取与 watch 事件因此类型一致。</text><circle cx="914" cy="671.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="675.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">KeyValue::decode() 统一解码</text><circle cx="914" cy="690.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="694.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">int64 → int，uint64 溢出留字符串</text><circle cx="914" cy="709.0" r="2.5" fill="#a78bfa"/><text x="926.0" y="713.0" font-size="10" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch 事件与 get() 同形</text><line x1="910" y1="734.0" x2="1140" y2="734.0" stroke="#20406b" stroke-width="1"/><text x="910.0" y="756.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">运行依赖</text><text x="910.0" y="780.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-client ^1.0  可选</text><text x="910.0" y="798.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">psr/http-factory ^1.0  可选</text><text x="910.0" y="816.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grpc/grpc  建议（gRPC 传输）</text><text x="910.0" y="834.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">google/protobuf  建议</text><text x="910.0" y="852.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">php &gt;= 8.0</text><text x="40.0" y="130" font-size="15" fill="#7dd3fc" text-anchor="start" font-weight="700">① 框架适配层</text><rect x="40" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="135.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Laravel</text><text x="135.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ServiceProvider + Facade</text><rect x="250" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="345.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Hyperf</text><text x="345.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">ConfigProvider（自动发现）</text><rect x="460" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="555.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">ThinkPHP</text><text x="555.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Service + Facade</text><rect x="670" y="144" width="190" height="80" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="765.0" y="178" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="700">Webman</text><text x="765.0" y="202" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">Plugin::install()</text><line x1="450" y1="224" x2="450" y2="248" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="245" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">自动发现 / 手动注册</text><text x="40.0" y="258" font-size="15" fill="#4fb3ff" text-anchor="start" font-weight="700">② 门面层</text><rect x="40" y="272" width="820" height="120" rx="16" fill="#16253c" stroke="#4fb3ff" stroke-width="1.5"/><text x="450.0" y="304" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">EtcdClient —— 统一入口，惰性构建六大子系统</text><rect x="60" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="120.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">kv</text><rect x="192" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="252.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch</text><rect x="324" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="384.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">lease</text><rect x="456" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="516.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">auth</text><rect x="588" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="648.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">cluster</text><rect x="720" y="322" width="120" height="44" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="780.0" y="350" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">maintenance</text><line x1="450" y1="392" x2="450" y2="416" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="413" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">领域方法调用</text><text x="40.0" y="426" font-size="15" fill="#2dd4bf" text-anchor="start" font-weight="700">③ 子系统层 —— 六大 API 领域</text><rect x="40" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">KvClient</text><text x="58.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">put / get / getByPrefix / txn / compact</text><rect x="320" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="338.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">WatchClient</text><text x="338.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">watch / watchPrefix · 断线续订</text><rect x="600" y="440" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="618.0" y="466" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">LeaseClient</text><text x="618.0" y="498" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">grant / keepAlive / revoke / TTL</text><rect x="40" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="58.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">AuthClient · UserClient · RoleClient</text><text x="58.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC：用户 / 角色 / 权限</text><rect x="320" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="338.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">ClusterClient</text><text x="338.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">成员增删 / Learner 提升</text><rect x="600" y="538" width="260" height="82" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="618.0" y="564" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="700">MaintenanceClient</text><text x="618.0" y="596" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">status / alarm / defrag / snapshot</text><line x1="450" y1="620" x2="450" y2="644" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="641" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">send() / sendRaw() / watch()</text><text x="40.0" y="654" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="700">④ 传输层</text><rect x="40" y="668" width="820" height="57" rx="12" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><text x="60.0" y="694" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700">TransportSelector</text><text x="60.0" y="714" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">transport = auto / http / grpc；auto 目前等同 http（GrpcTransport 仍是骨架，未实现），显式传 grpc 才会选中它</text><rect x="40" y="751" width="400" height="96" rx="12" fill="#111c2e" stroke="#2dd4bf" stroke-width="1.5"/><text x="58.0" y="781" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">HttpTransport</text><text x="58.0" y="805" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd 内置 gRPC-gateway，JSON over HTTP</text><text x="58.0" y="825" font-size="10.5" fill="#5b7699" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">cURL / stream / PSR-18</text><rect x="392.0" y="765" width="32.0" height="22" rx="11" fill="#0b1220" stroke="#2dd4bf" stroke-width="1"/><text x="408.0" y="780" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="400">可用</text><rect x="460" y="751" width="400" height="96" rx="12" fill="#111c2e" stroke="#fbbf24" stroke-width="1.5"/><text x="478.0" y="781" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">GrpcTransport</text><text x="478.0" y="805" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Grpc\Channel 复用，原生流式</text><text x="478.0" y="825" font-size="10.5" fill="#5b7699" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">ext-grpc + grpc/grpc + google/protobuf</text><rect x="812.0" y="765" width="32.0" height="22" rx="11" fill="#0b1220" stroke="#fbbf24" stroke-width="1"/><text x="828.0" y="780" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="400">骨架</text><path d="M 450 725 V 737 H 240 V 749" fill="none" stroke="#20406b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M 450 725 V 737 H 660 V 749" fill="none" stroke="#20406b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><line x1="450" y1="847" x2="450" y2="871" stroke="#4fb3ff" stroke-width="2" marker-end="url(#ah)" opacity="0.75"/><text x="462.0" y="868" font-size="11.5" fill="#5b7699" text-anchor="start" font-weight="400">TCP :2379</text><text x="40.0" y="881" font-size="15" fill="#fb923c" text-anchor="start" font-weight="700">⑤ etcd 服务端集群 (v3.x)</text><rect x="40" y="895" width="820" height="104" rx="16" fill="#16253c" stroke="#fb923c" stroke-width="1.5"/><rect x="60" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="181.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">gRPC-gateway  /v3/*</text><text x="181.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">HTTP JSON 入口</text><rect x="322" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="443.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">原生 gRPC  :2379</text><text x="443.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">高性能 / 双向流</text><rect x="584" y="913" width="242" height="68" rx="10" fill="#0b1220" stroke="#20406b" stroke-width="1"/><text x="705.0" y="939" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">Raft + MVCC</text><text x="705.0" y="961" font-size="11" fill="#8aa0bd" text-anchor="middle" font-weight="400">共识 · 多版本 · Lease 定时器</text>
</svg>
