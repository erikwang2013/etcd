<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Helvetica,Arial,'Noto Sans','Noto Sans CJK SC','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Arabic','Lohit Devanagari','PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">erikwang2013/etcd 功能设计图</title>
  <desc id="dsc">KV、Watch、Lease、Auth、Cluster、Maintenance 六大功能域及其方法与行为约定。</desc>
  <rect x="0" y="0" width="1200" height="10000" rx="0" fill="#0b1220" stroke="none" stroke-width="1.5"/><text x="40.0" y="56" font-size="27" fill="#e6edf3" text-anchor="start" font-weight="700">erikwang2013/etcd · 功能设计</text><text x="40.0" y="86" font-size="14" fill="#8aa0bd" text-anchor="start" font-weight="400">六大 API 领域 —— 方法速览与行为约定</text><rect x="40" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#4fb3ff" stroke-width="1.5"/><text x="88.0" y="185" font-size="20" fill="#4fb3ff" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">K</text><text x="126.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">KV 键值存储</text><text x="126.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">etcd 的核心读写，含前缀扫描与原子事务</text><line x1="66" y1="222" x2="371" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="244" r="2.5" fill="#4fb3ff"/><text x="80.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">put(k, v[, lease, prevKv])</text><circle cx="69" cy="269" r="2.5" fill="#4fb3ff"/><text x="80.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">get(k[, rangeEnd, limit, revision])</text><circle cx="69" cy="294" r="2.5" fill="#4fb3ff"/><text x="80.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">getByPrefix(p) / getOrFail(k)</text><circle cx="69" cy="319" r="2.5" fill="#4fb3ff"/><text x="80.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">delete(k) / deleteByPrefix(p)</text><circle cx="69" cy="344" r="2.5" fill="#4fb3ff"/><text x="80.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">txn(compare, success, failure)</text><circle cx="69" cy="369" r="2.5" fill="#4fb3ff"/><text x="80.0" y="373" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">compact(revision) 压缩历史版本</text><line x1="66" y1="388" x2="371" y2="388" stroke="#20406b" stroke-width="1"/><text x="66.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">输出为关联数组；getOrFail() 未命中抛</text><text x="66.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">KeyNotFoundException；txn 为 compare → success</text><text x="66.0" y="443.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">/ failure 三段式。</text><rect x="421" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="469.0" y="185" font-size="20" fill="#2dd4bf" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">W</text><text x="507.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Watch 变更监听</text><text x="507.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">基于 HTTP chunked 的长连接事件流</text><line x1="447" y1="222" x2="752" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="244" r="2.5" fill="#2dd4bf"/><text x="461.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watch(key, cb[, opts])</text><circle cx="450" cy="269" r="2.5" fill="#2dd4bf"/><text x="461.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">watchPrefix(prefix, cb)</text><circle cx="450" cy="294" r="2.5" fill="#2dd4bf"/><text x="461.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">startRevision / prevKv / progressNotify</text><circle cx="450" cy="319" r="2.5" fill="#2dd4bf"/><text x="461.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">流式分块读取，非阻塞 I/O</text><circle cx="450" cy="344" r="2.5" fill="#2dd4bf"/><text x="461.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">断线自动重连，以 lastRevision 续订</text><line x1="447" y1="388" x2="752" y2="388" stroke="#20406b" stroke-width="1"/><text x="447.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">EOF 后按 100ms×n 退避并随机换端点重连，故障转移不丢</text><text x="447.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">事件。</text><rect x="802" y="130" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="156" width="44" height="44" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="850.0" y="185" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">L</text><text x="888.0" y="176" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Lease 租约</text><text x="888.0" y="198" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">带 TTL 的 key，到期由 etcd 自动清理</text><line x1="828" y1="222" x2="1133" y2="222" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="244" r="2.5" fill="#fbbf24"/><text x="842.0" y="248" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">grant(ttl[, id]) → {ID, TTL}</text><circle cx="831" cy="269" r="2.5" fill="#fbbf24"/><text x="842.0" y="273" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">keepAlive(id) 单次续约</text><circle cx="831" cy="294" r="2.5" fill="#fbbf24"/><text x="842.0" y="298" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">timeToLive(id[, keys]) 查状态</text><circle cx="831" cy="319" r="2.5" fill="#fbbf24"/><text x="842.0" y="323" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">list() 列出活跃租约</text><circle cx="831" cy="344" r="2.5" fill="#fbbf24"/><text x="842.0" y="348" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">revoke(id) 撤销并删除绑定 key</text><line x1="828" y1="388" x2="1133" y2="388" stroke="#20406b" stroke-width="1"/><text x="828.0" y="412.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">服务注册的标准姿势：grant + put(lease) + 定时</text><text x="828.0" y="427.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">keepAlive 心跳；进程崩溃也无需手工清理。</text><rect x="40" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="66" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/><text x="88.0" y="539" font-size="20" fill="#a78bfa" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">A</text><text x="126.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Auth 认证授权</text><text x="126.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">RBAC：用户 → 角色 → 权限</text><line x1="66" y1="576" x2="371" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="69" cy="598" r="2.5" fill="#a78bfa"/><text x="80.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">enable() / disable() / status()</text><circle cx="69" cy="623" r="2.5" fill="#a78bfa"/><text x="80.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().add / get / list / delete</text><circle cx="69" cy="648" r="2.5" fill="#a78bfa"/><text x="80.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().grantRole / revokeRole</text><circle cx="69" cy="673" r="2.5" fill="#a78bfa"/><text x="80.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">user().changePassword(name, pass)</text><circle cx="69" cy="698" r="2.5" fill="#a78bfa"/><text x="80.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().add / get / list / delete</text><circle cx="69" cy="723" r="2.5" fill="#a78bfa"/><text x="80.0" y="727" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">role().grantPermission / revokePermission</text><line x1="66" y1="742" x2="371" y2="742" stroke="#20406b" stroke-width="1"/><text x="66.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">权限类型 0=READ 1=WRITE 2=READWRITE；开启认证后客</text><text x="66.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">户端必须配置 auth.user / auth.password。</text><rect x="421" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="447" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.5"/><text x="469.0" y="539" font-size="20" fill="#7dd3fc" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">C</text><text x="507.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Cluster 集群管理</text><text x="507.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">成员增删与 Learner 生命周期</text><line x1="447" y1="576" x2="752" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="450" cy="598" r="2.5" fill="#7dd3fc"/><text x="461.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberList() 成员列表</text><circle cx="450" cy="623" r="2.5" fill="#7dd3fc"/><text x="461.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberAdd(peers[, isLearner])</text><circle cx="450" cy="648" r="2.5" fill="#7dd3fc"/><text x="461.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberUpdate(id, peers)</text><circle cx="450" cy="673" r="2.5" fill="#7dd3fc"/><text x="461.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberPromote(id) Learner → Voter</text><circle cx="450" cy="698" r="2.5" fill="#7dd3fc"/><text x="461.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">memberRemove(id)</text><line x1="447" y1="742" x2="752" y2="742" stroke="#20406b" stroke-width="1"/><text x="447.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Learner 先以非投票身份加入，再 promote 提升为</text><text x="447.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">Voter，扩容不影响 quorum。</text><rect x="802" y="484" width="357" height="330" rx="16" fill="#111c2e" stroke="#20406b" stroke-width="1.5"/><rect x="828" y="510" width="44" height="44" rx="13" fill="#0b1220" stroke="#fb923c" stroke-width="1.5"/><text x="850.0" y="539" font-size="20" fill="#fb923c" text-anchor="middle" font-weight="700" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">M</text><text x="888.0" y="530" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="700">Maintenance 运维</text><text x="888.0" y="552" font-size="11.5" fill="#8aa0bd" text-anchor="start" font-weight="400">集群状态、告警与备份</text><line x1="828" y1="576" x2="1133" y2="576" stroke="#20406b" stroke-width="1"/><circle cx="831" cy="598" r="2.5" fill="#fb923c"/><text x="842.0" y="602" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">status() → version / dbSize / leader</text><circle cx="831" cy="623" r="2.5" fill="#fb923c"/><text x="842.0" y="627" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">alarm([action, alarm, memberID])</text><circle cx="831" cy="648" r="2.5" fill="#fb923c"/><text x="842.0" y="652" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">defragment() 碎片整理</text><circle cx="831" cy="673" r="2.5" fill="#fb923c"/><text x="842.0" y="677" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">hash([revision]) KV 哈希校验</text><circle cx="831" cy="698" r="2.5" fill="#fb923c"/><text x="842.0" y="702" font-size="10.5" fill="#c3d0e0" text-anchor="start" font-weight="400" font-family="'DejaVu Sans Mono',Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">snapshot() 返回原始二进制</text><line x1="828" y1="742" x2="1133" y2="742" stroke="#20406b" stroke-width="1"/><text x="828.0" y="766.0" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">snapshot() 经 sendRaw() 返回原始二进制，可直接落盘</text><text x="828.0" y="781.5" font-size="11" fill="#8aa0bd" text-anchor="start" font-weight="400">作为备份文件。</text><text x="40.0" y="846" font-size="12" fill="#5b7699" text-anchor="start" font-weight="400">所有方法失败时抛出 Erikwang2013\Etcd\Exception 下的类型化异常；HTTP 与 gRPC 两种传输共用同一套子系统 API。</text>
</svg>
