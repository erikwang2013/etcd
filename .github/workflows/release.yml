name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Determine next version
        id: version
        run: |
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            echo "prev=" >> "$GITHUB_OUTPUT"
            echo "no previous tag: first release is 0.1.0"
            exit 0
          fi

          range="$latest..HEAD"
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)

          # Minor when the release adds public API: a new PHP type under src/,
          # or any commit in the range carrying a [minor] marker (for changes
          # that introduce API without adding a file, or for forcing a bump).
          new_types=$(git diff -U0 "$range" -- src/ \
            | grep -cE '^\+[[:space:]]*(final |abstract |readonly )*(class|interface|trait|enum) ' || true)
          if [ "$new_types" -gt 0 ]; then
            bump=minor
            reason="added public type under src/ ($new_types declaration(s))"
          elif git log --format='%s%n%b' "$range" | grep -qE '\[minor\]'; then
            bump=minor
            reason="a commit in $range is marked [minor]"
          else
            bump=patch
            reason="no new public API in $range"
          fi

          if [ "$bump" = minor ]; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "prev=$latest" >> "$GITHUB_OUTPUT"
          echo "$latest -> v$next ($bump: $reason)"

      - name: Run tests
        run: composer install --no-interaction --prefer-dist && vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Unit --no-coverage

      - name: Build changelog since previous release
        id: changelog
        run: |
          prev=${{ steps.version.outputs.prev }}
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          git log --oneline --no-merges "$range" | sed 's/^/- /' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          body: |
            <img src="https://raw.githubusercontent.com/erikwang2013/etcd/main/docs/pet.svg" alt="Etchy" width="120" align="right" />

            ${{ steps.changelog.outputs.notes }}
          # No artifact packaging: this library ships as source only.
