syntax = "proto3";
package authpb;

// Added locally: without this the generated classes land in the global
// namespace ("Etcdserverpb\"), where they can collide with anything else on
// the autoloader. Everything else in this file is upstream verbatim.
option php_metadata_namespace = "Erikwang2013\\Etcd\\Proto\\GPBMetadata";
option php_namespace = "Erikwang2013\\Etcd\\Proto\\Authpb";

message UserAddOptions {
  bool no_password = 1;
};

// User is a single entry in the bucket authUsers
message User {
  bytes name = 1;
  bytes password = 2;
  repeated string roles = 3;
  UserAddOptions options = 4;
}

// Permission is a single entity
message Permission {
  enum Type {
    READ = 0;
    WRITE = 1;
    READWRITE = 2;
  }
  Type permType = 1;

  bytes key = 2;
  bytes range_end = 3;
}

// Role is a single entry in the bucket authRoles
message Role {
  bytes name = 1;

  repeated Permission keyPermission = 2;
}
